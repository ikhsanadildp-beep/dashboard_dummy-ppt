        function getISOWeekFromDate(dateObj) {
            if (!dateObj || isNaN(dateObj)) return "Unknown Week";
            let year = dateObj.getFullYear();
            let month = dateObj.getMonth();
            let day = dateObj.getDate();
            let dateNum = year * 10000 + (month + 1) * 100 + day;

            if (dateNum >= 20260101 && dateNum <= 20261231) {
                let startOfYear = new Date(2026, 0, 1);
                let startDayOfWeek = startOfYear.getDay() || 7;
                let adjustedStart = new Date(2026, 0, 1 - startDayOfWeek + 1);
                let diffDays = Math.floor((dateObj - adjustedStart) / (24 * 60 * 60 * 1000));
                let weekNo = Math.floor(diffDays / 7) + 1;
                if (weekNo < 1) weekNo = 1;
                return `Week ${weekNo}`;
            }

            let startOfYear = new Date(dateObj.getFullYear(), 0, 1);
            let diffDays = Math.floor((dateObj - startOfYear) / (24 * 60 * 60 * 1000));
            let weekNo = Math.ceil((diffDays + startOfYear.getDay() + 1) / 7);
            return `Week ${weekNo}`;
        }

        function getWeekDateRange2026(weekStr) {
            let match = weekStr.match(/\d+/);
            if (!match) return weekStr;
            let weekNum = parseInt(match[0]);

            let jan1 = new Date(2026, 0, 1);
            let dayOfWeek = jan1.getDay() || 7;
            let yearStart = new Date(2026, 0, 1 - dayOfWeek + 1);

            let targetMonday = new Date(yearStart.getTime());
            targetMonday.setDate(targetMonday.getDate() + (weekNum - 1) * 7);

            let targetSunday = new Date(targetMonday.getTime());
            targetSunday.setDate(targetMonday.getDate() + 6);

            const options = { day: 'numeric', month: 'short' };
            return `${weekStr} (${targetMonday.toLocaleDateString('id-ID', options)} - ${targetSunday.toLocaleDateString('id-ID', options)})`;
        }

        // Helper khusus untuk memparsing format tanggal MM/DD/YY (atau format umum lainnya)
        function parseDateMMDDYY(dateVal) {
            if (!dateVal) return null;

            // Jika formatnya berupa serial number Excel
            if (typeof dateVal === 'number') {
                return new Date((dateVal - (25567 + 2)) * 86400 * 1000);
            }

            let strVal = dateVal.toString().trim();
            if (!strVal) return null;

            // Ambil bagian tanggalnya saja (pisahkan dengan spasi jika ada waktu di belakangnya)
            let cleanStr = strVal.split(' ')[0];
            let parts = cleanStr.split(/[\/\-]/);

            if (parts.length === 3) {
                let p1 = parseInt(parts[0], 10);
                let p2 = parseInt(parts[1], 10);
                let p3 = parseInt(parts[2], 10);

                let month, day, year;

                // Asumsi format MM/DD/YY atau MM/DD/YYYY
                month = p1;
                day = p2;
                year = p3;

                // Normalisasi tahun 2 digit (misal: '26' menjadi 2026)
                if (year < 100) {
                    year += 2000;
                }

                let parsed = new Date(year, month - 1, day);
                if (!isNaN(parsed)) {
                    return parsed;
                }
            }

            // Fallback ke parser standar JS jika format string berbeda
            let fallbackDate = new Date(strVal);
            return !isNaN(fallbackDate) ? fallbackDate : null;
        }

                    }

                    let idxScore = headers.findIndex(h => h.includes('qa score') || h.includes('grouping qa score') || h.includes('total qa score'));
                    
                    let idxComment = headers.findIndex(h => 
                        h === 'comment qa call' || 
                        h === 'comment qa emai' || h === 'comment qa email' || 
                        h === 'comment qa chat' ||
                        (h.includes('comment qa') && !h.includes('date') && !h.includes('by') && !h.includes('leader') && !h.includes('submit'))
                    );

                    let idxRekomendasi = headers.findIndex(h =>
                        h === 'rekomendasi qa chat' ||
                        h === 'rekomendasi qa call' ||
                        h === 'rekomendasi qa email' ||
                        h.includes('rekomendasi qa')
                    );
                   
                    // Membaca kolom tanggal: Messaging Session: Created Date/Time, Case: Date/Time Opened, atau Date/Time Sampling Call
                    let idxWeekDate = headers.findIndex(h => {
    let cleanHeader = h.trim();
    return cleanHeader === 'date/time sampling chat' ||
           cleanHeader === 'case: date/time opened' ||
           cleanHeader === 'date/time sampling call';
});
                    if (idxWeekDate === -1) {
                        idxWeekDate = headers.findIndex(h => h.includes('date') || h.includes('time'));
                    }
                                  
                    let idxSource = headers.findIndex(h => h === 'source' || h.includes('channel'));

                    if (idxAgent === -1 || idxScore === -1) continue;

                    for (let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        let ms = idxMs !== -1 ? r[idxMs]?.toString().trim() : `MS-${fIdx}-${i}`;
                        let rawAgent = r[idxAgent]?.toString().trim();
                        let matchedAgent = getMatchedTeamAgent(rawAgent);
                        
                        if (!matchedAgent) continue; 

                        let scoreVal = parseFloat(r[idxScore]);
                        let comment = idxComment !== -1 ? r[idxComment]?.toString().trim() : "";
                        let rekomendasiVal = idxRekomendasi !== -1 ? r[idxRekomendasi]?.toString().trim() : "";
                        let rawSource = idxSource !== -1 ? r[idxSource]?.toString().trim() : "";
                        
                        let source = "Chat";
                        let lowerRawSource = rawSource.toLowerCase();

                        if (lowerRawSource.includes('call') || lowerRawSource.includes('frontline') || combinedRowStrIncludesCall(r) || rawAgent.toLowerCase().includes('frontline call') || ms.toLowerCase().includes('call')) {
                            source = "Call";
                        } else if (lowerRawSource.includes('facebook') || lowerRawSource.includes('instagram') || lowerRawSource.includes('ig') || lowerRawSource.includes('fb')) {
                            source = "Sosmed";
                        } else if (rawSource !== "") {
                            source = rawSource;
                        }

                        // Di dalam perulangan baris (for row):
let weekName = detectedWeekName; // Langsung ambil dari nama file

uniqueWeeksSet.add(weekName);
if (!weekLabelsMap[weekName]) {
    weekLabelsMap[weekName] = getWeekDateRange2026(weekName);
}

allRawDataRecords.push({
    agent: matchedAgent,
    channel: source,
    week: weekName,
    score: !isNaN(scoreVal) ? scoreVal : 0
});

                        let lowerComment = comment.toLowerCase();
                        let isInvalidFinding = (comment === "" || comment === "-" || lowerComment === "null" || lowerComment.includes("tidak ada finding") || lowerComment.includes("tidak ada findnig") || lowerComment.includes("tidka ada finding") || lowerComment.includes("tidak ada temuan") || lowerComment.includes(" aman ") || lowerComment === "aman");

                        if (!isInvalidFinding) {
                            uniqueFindingWeeks.add(weekName);
                            let finalRekomendasi = rekomendasiVal !== "" ? rekomendasiVal : "";

                            tempFindings.push({
                                ms: ms || "-",
                                agentName: matchedAgent,
                                finding: finalRekomendasi,
                                originalFinding: comment,
                                week: weekName
                            });
                        }
                    }
                }

                let pivotMap = {};
                allRawDataRecords.forEach(item => {
                    let key = `${item.agent}`;
                    if (!pivotMap[key]) {
                        pivotMap[key] = { agent: item.agent, channel: '', weeks: {} };
                    }
                    if (!pivotMap[key].weeks[item.week]) {
                        pivotMap[key].weeks[item.week] = { sum: 0, count: 0 };
                    }
                    pivotMap[key].weeks[item.week].sum += item.score;
                    pivotMap[key].weeks[item.week].count += 1;
                });

                let sortedWeeks = Array.from(uniqueWeeksSet).sort((a, b) => {
                    let numA = parseInt(a.replace(/\D/g, '')) || 0;
                    let numB = parseInt(b.replace(/\D/g, '')) || 0;
                    return numA - numB;
                });

                let mergedMatrixMap = {};
                Object.values(pivotMap).forEach(p => {
                    let rawChan = (p.channel || '').trim();
                    let lowerChan = rawChan.toLowerCase();
                    let channel = (lowerChan === 'facebook' || lowerChan === 'instagram' || lowerChan === 'fb' || lowerChan === 'ig') ? 'Sosmed' : rawChan;

                    let key = `${p.agent}|${channel}`;
                    if (!mergedMatrixMap[key]) {
                        mergedMatrixMap[key] = { agent: p.agent, channel: channel, weeksRaw: {} };
                    }

                    Object.keys(p.weeks).forEach(w => {
                        if (!mergedMatrixMap[key].weeksRaw[w]) {
                            mergedMatrixMap[key].weeksRaw[w] = { sum: 0, count: 0 };
                        }
                        mergedMatrixMap[key].weeksRaw[w].sum += p.weeks[w].sum;
                        mergedMatrixMap[key].weeksRaw[w].count += p.weeks[w].count;
                    });
                });

                let tempMatrixRows = [];
                Object.values(mergedMatrixMap).forEach(item => {
                    let weekScores = {};
                    sortedWeeks.forEach(w => {
                        if (item.weeksRaw[w] && item.weeksRaw[w].count > 0) {
                            weekScores[w] = parseFloat((item.weeksRaw[w].sum / item.weeksRaw[w].count).toFixed(1));
                        }
                    });
                    tempMatrixRows.push({
                        agent: item.agent,
                        channel: item.channel,
                        isAvg: false,
                        weeks: weekScores
                    });
                });

                let avgWeeks = {};
                sortedWeeks.forEach(w => {
                    let totalSum = 0, totalCount = 0;
                    tempMatrixRows.forEach(row => {
                        if (row.weeks[w] !== undefined) {
                            totalSum += row.weeks[w];
                            totalCount += 1;
                        }
                    });
                    if (totalCount > 0) {
                        avgWeeks[w] = parseFloat((totalSum / totalCount).toFixed(1));
                    }
                });

                tempMatrixRows.push({
                    agent: 'AVG',
                    channel: '',
                    isAvg: true,
                    weeks: avgWeeks
                });

                await saveToSupabase(tempMatrixRows, tempFindings);
                await loadFromSupabase();

                alert(`Berhasil mengimpor ${files.length} file Excel sekaligus dan memperbarui database!`);
            } catch (err) {
                alert('Terjadi kesalahan saat memproses file Excel: ' + err.message);
                console.error(err);
            } finally {
                uploadBtn.innerText = "Import Excel QA (Data Mentah)";
                uploadBtn.style.pointerEvents = 'auto';
                event.target.value = '';
            }
        }

        async function resetSupabaseData() {
            let confirmation = confirm("Apakah Anda yakin ingin MENGHAPUS SEMUA data QA Matrix dan Findings yang tersimpan di Supabase?");
            if (!confirmation) return;

            try {
                await supabaseClient.from('qa_matrix2').delete().neq('id', 0);
                await supabaseClient.from('qa_findings2').delete().neq('id', 0);

                qaReportData = { weeks: [], weekLabelsMap: {}, matrixAgents: [], findingAgents: [], findingWeeks: [], matrixRows: [], findings: [] };

                document.getElementById('qaMatrixContainer').innerHTML = `<p class="text-gray-500 text-center py-4">Belum ada data di database.</p>`;
                document.getElementById('qaFindingContainer').innerHTML = `<p class="text-gray-500 text-center py-4">Belum ada data di database.</p>`;
                
                document.getElementById('filterMatrixAgent').innerHTML = '<option value="all">Semua Anggota Tim</option>';
                document.getElementById('filterFindingAgent').innerHTML = '<option value="all">Semua Anggota Tim</option>';
                document.getElementById('filterFindingWeek').innerHTML = '<option value="all">Semua Minggu</option>';

                alert("Semua data berhasil dibersihkan.");
            } catch (err) {
                alert("Terjadi kesalahan saat menghapus data: " + err.message);
            }
        }

        function combinedRowStrIncludesCall(rowArray) {
            return rowArray.some(cellVal => {
                if (!cellVal) return false;
                let text = cellVal.toString().toLowerCase();
                return text.includes('frontline call') || text.includes('(call)');
            });
        }

        function initFilters() {
            const matrixAgentSelect = document.getElementById('filterMatrixAgent');
            let currentMatrixVal = matrixAgentSelect.value;
            matrixAgentSelect.innerHTML = '<option value="all">Semua Anggota Tim</option>';
            MY_TEAM_AGENTS.forEach(agent => {
                if (qaReportData.matrixAgents.includes(agent)) {
                    matrixAgentSelect.innerHTML += `<option value="${agent}">${agent}</option>`;
                }
            });
            matrixAgentSelect.value = (currentMatrixVal && matrixAgentSelect.querySelector(`option[value="${currentMatrixVal}"]`)) ? currentMatrixVal : 'all';

            const findingAgentSelect = document.getElementById('filterFindingAgent');
            let currentFindingAgentVal = findingAgentSelect.value;
            findingAgentSelect.innerHTML = '<option value="all">Semua Anggota Tim</option>';
            MY_TEAM_AGENTS.forEach(agent => {
                if (qaReportData.findingAgents.includes(agent)) {
                    findingAgentSelect.innerHTML += `<option value="${agent}">${agent}</option>`;
                }
            });
            findingAgentSelect.value = (currentFindingAgentVal && findingAgentSelect.querySelector(`option[value="${currentFindingAgentVal}"]`)) ? currentFindingAgentVal : 'all';

            const weekSelect = document.getElementById('filterFindingWeek');
            let currentWeekVal = weekSelect.value;
            weekSelect.innerHTML = '<option value="all">Semua Minggu</option>';
            qaReportData.findingWeeks.forEach(week => {
                let displayLabel = qaReportData.weekLabelsMap[week] || getWeekDateRange2026(week);
                weekSelect.innerHTML += `<option value="${week}">${displayLabel}</option>`;
            });
            weekSelect.value = qaReportData.findingWeeks.includes(currentWeekVal) ? currentWeekVal : 'all';
        }

        function getScoreBadgeColor(val) {
            if (typeof val === 'number') {
                if (val >= 95.0) return 'bg-green-100 text-green-800 font-bold';
                else if (val >= 90.0) return 'bg-yellow-100 text-yellow-800 font-bold';
                else return 'bg-pink-100 text-pink-800 font-bold';
            }
            return 'bg-gray-200 text-gray-700 font-medium text-xs';
        }

        function renderMatrixTable() {
            const matrixContainer = document.getElementById('qaMatrixContainer');
            const selectedAgent = document.getElementById('filterMatrixAgent').value;

            if (qaReportData.matrixRows.length === 0) {
                matrixContainer.innerHTML = `<p class="text-gray-500 text-center py-4">Belum ada data nilai QA.</p>`;
                return;
            }

            let weeksToDisplay = qaReportData.weeks;

            let regularRows = qaReportData.matrixRows.filter(r => !r.isAvg && r.agent !== 'AVG');
            let avgRows = qaReportData.matrixRows.filter(r => r.isAvg || r.agent === 'AVG');

            if (selectedAgent !== 'all') {
                regularRows = regularRows.filter(r => (r.agent || '').trim().toLowerCase() === selectedAgent.trim().toLowerCase());
            }

            regularRows.sort((a, b) => {
                let agentA = (a.agent || '').toLowerCase();
                let agentB = (b.agent || '').toLowerCase();
                if (agentA < agentB) return -1;
                if (agentA > agentB) return 1;
                return 0;
            });

            let sortedMatrixRows = selectedAgent === 'all' ? [...regularRows, ...avgRows] : [...regularRows];

            let tableHTML = `
                <table class="min-w-full divide-y divide-gray-200 bg-white rounded-md text-sm border border-collapse">
                    <thead class="bg-gray-100 text-gray-700">
                        <tr>
                            <th class="px-4 py-2 text-left border-r sticky-col whitespace-nowrap">Nama Agent</th>
            `;
            
            weeksToDisplay.forEach(week => {
                let fullLabel = qaReportData.weekLabelsMap[week] || getWeekDateRange2026(week);
                let parts = fullLabel.split(' (');
                tableHTML += `<th class="px-3 py-2 text-center border-r whitespace-nowrap">${parts[0]}<br><span class="text-xs font-normal text-gray-500">(${parts[1] || ''}</span></th>`;
            });

            tableHTML += `</tr></thead><tbody class="divide-y divide-gray-200 text-gray-600">`;

            sortedMatrixRows.forEach(row => {
                let isAverageRow = row.isAvg || row.agent === 'AVG';
                let rowBg = isAverageRow ? 'bg-gray-100 font-bold text-gray-900' : '';
                tableHTML += `<tr class="${rowBg}">`;
                tableHTML += `<td class="px-4 py-2 border-r font-medium sticky-col whitespace-nowrap">${row.agent}</td>`;

                weeksToDisplay.forEach(week => {
                    let val = row.weeks[week];
                    let scoreDisplay = val !== undefined ? val.toFixed(1) : '-';
                    let badgeColor = isAverageRow ? 'text-gray-900 font-bold' : getScoreBadgeColor(val);
                    tableHTML += `<td class="px-3 py-2 text-center border-r"><span class="px-2 py-1 rounded ${badgeColor}">${scoreDisplay}</span></td>`;
                });
                tableHTML += `</tr>`;
            });

            tableHTML += `</tbody></table>`;
            matrixContainer.innerHTML = tableHTML;
        }

        function renderFindingTable() {
            const selectedAgent = document.getElementById('filterFindingAgent').value;
            const selectedWeek = document.getElementById('filterFindingWeek').value;
            const findingContainer = document.getElementById('qaFindingContainer');

            let filteredFindings = qaReportData.findings.filter(f => {
                let matchAgent = (selectedAgent === 'all' || (f.agentName || '').trim().toLowerCase() === selectedAgent.trim().toLowerCase());
                let matchWeek = (selectedWeek === 'all' || f.week === selectedWeek);
                return matchAgent && matchWeek;
            });

            if (filteredFindings.length === 0) {
                findingContainer.innerHTML = `<p class="text-gray-500 text-center py-4">Tidak ada data detail finding QA yang cocok dengan filter.</p>`;
                return;
            }

            filteredFindings.sort((a, b) => {
                let numWeekA = parseInt((a.week || '').replace(/\D/g, '')) || 0;
                let numWeekB = parseInt((b.week || '').replace(/\D/g, '')) || 0;

                if (numWeekB !== numWeekA) {
                    return numWeekB - numWeekA;
                }

                let nameA = (a.agentName || '').toLowerCase();
                let nameB = (b.agentName || '').toLowerCase();
                if (nameA < nameB) return -1;
                if (nameA > nameB) return 1;
                return 0;
            });

            let html = `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 bg-white rounded-md overflow-hidden text-sm border">
                        <thead class="bg-gray-100 text-gray-700">
                            <tr>
                                <th class="px-4 py-3 text-left">MS / Activity</th>
                                <th class="px-4 py-3 text-left">Nama Agent</th>
                                <th class="px-4 py-3 text-left">Komentar QA</th>
                                <th class="px-4 py-3 text-left">Rekomendasi QA</th>
                                <th class="px-4 py-3 text-center">Minggu</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200 text-gray-700">
            `;

            filteredFindings.forEach(f => {
                let weekDisplay = qaReportData.weekLabelsMap[f.week] || getWeekDateRange2026(f.week);
                let findingDisplay = (f.finding && f.finding !== "") ? f.finding : "-";
                html += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-4 py-3 font-mono text-blue-600 font-medium">${f.ms}</td>
                        <td class="px-4 py-3 font-bold text-gray-800">${f.agentName}</td>
                        <td class="px-4 py-3 italic text-gray-600">"${f.originalFinding || '-'}"</td>
                        <td class="px-4 py-3 text-gray-800 font-medium">${findingDisplay}</td>
                        <td class="px-4 py-3 text-center"><span class="text-blue-700 px-2 py-0.5 whitespace-nowrap">${weekDisplay}</span></td>
                    </tr>
                `;
            });

            html += `</tbody></table></div>`;
            findingContainer.innerHTML = html;
        }
    </script>
